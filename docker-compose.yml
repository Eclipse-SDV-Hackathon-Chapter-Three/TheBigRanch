version: '3.9'

services:
  pothole-detector:
    build: ./adas
    container_name: pothole-detector
    networks:
      - zenoh-net

  carla:
    build: ./carla-setup
    container_name: fake-publisher-carla
    networks:
      - zenoh-net

  heatmap:
    build: ./infotainment
    container_name: heatmap
    ports:
      - 8501:8501
    networks:
      - zenoh-net

networks:
  zenoh-net:
    driver: bridge
